name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct URL to Decrypted IPA file"
        type: string
        required: true
      create_release:
        description: "Create draft release"
        default: false
        type: boolean

jobs:
  deb:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Get package info
        id: package_info
        run: |
          version=$(cat Makefile | grep "PACKAGE_VERSION =" | cut -d' ' -f3)
          if [ -z $version ]; then
            version=$(cat control | grep "Version:" | cut -d' ' -f2)
          fi
          echo "id=$(cat control | grep "Package:" | cut -d' ' -f2)" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Setup theos
        uses: level3tjg/theos-action@main
        with:
          cache: true
          cache-dir-theos: ${{ github.workspace }}/theos
          cache-dir-sdks: ${{ github.workspace }}/theos/sdks

      - name: Build rootless deb
        run: make package
        env:
          THEOS_PACKAGE_SCHEME: rootless

      - name: Build rootful deb
        run: make clean package

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package_info.outputs.id }}_${{ steps.package_info.outputs.version }}
          path: packages/*.deb
          if-no-files-found: error

  ipa:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Get package info
        id: package_info
        run: |
          version=$(cat Makefile | grep "PACKAGE_VERSION =" | cut -d' ' -f3)
          if [ -z $version ]; then
            version=$(cat control | grep "Version:" | cut -d' ' -f2)
          fi
          echo "id=$(cat control | grep "Package:" | cut -d' ' -f2)" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y rsync llvm xmlstarlet

      - name: Download IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          echo "::add-mask::$IPA_URL"
          # Some file hosts (e.g. catbox) drop long transfers; resume until the file is complete
          for attempt in $(seq 1 20); do
            curl -fL -C - --retry 5 --retry-all-errors --retry-delay 3 \
              -o "${{ github.workspace }}/App.ipa" "$IPA_URL" && break
            echo "Download interrupted (attempt $attempt), resuming..."
            sleep 3
          done
          zip -T "${{ github.workspace }}/App.ipa"

      - name: Get IPA Info
        id: ipa_info
        run: |
          info=$(unzip -p "${{ github.workspace }}/App.ipa" Payload/*.app/Info.plist)
          echo "bundle-id=$(echo $info | xmlstarlet sel -t -v "/plist/dict/key[text()=\"CFBundleIdentifier\"]/following-sibling::*[1]/text()")" >> $GITHUB_OUTPUT
          echo "version=$(echo $info | xmlstarlet sel -t -v "/plist/dict/key[text()=\"CFBundleShortVersionString\"]/following-sibling::*[1]/text()")" >> $GITHUB_OUTPUT

      - name: Setup theos
        uses: level3tjg/theos-action@main
        with:
          cache: true
          cache-dir-theos: ${{ github.workspace }}/theos
          cache-dir-sdks: ${{ github.workspace }}/theos/sdks

      - name: Checkout theos-jailed
        uses: actions/checkout@v7
        with:
          repository: level3tjg/theos-jailed
          path: theos-jailed
          submodules: recursive

      - name: Install theos-jailed
        run: |
          # theos-jailed only needs `plistutil -f bin -i FILE -o FILE`. Ubuntu's libplist 2.2.0 fails
          # to parse the Substrate Info.plist (and still exits 0), so use a plistlib shim instead
          # of building libplist from source. Remove it afterwards so Theos leaves resource plists
          # alone, as before.
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/plistutil" <<'EOF'
          #!/usr/bin/env python3
          import plistlib, sys
          args = dict(zip(sys.argv[1::2], sys.argv[2::2]))
          with open(args["-i"], "rb") as f:
              data = plistlib.load(f)
          with open(args["-o"], "wb") as f:
              plistlib.dump(data, f, fmt=plistlib.FMT_BINARY)
          EOF
          chmod +x "$RUNNER_TEMP/bin/plistutil"
          PATH="$RUNNER_TEMP/bin:$PATH" ./theos-jailed/install
          rm "$RUNNER_TEMP/bin/plistutil"

      - name: Build IPA
        run: make package
        env:
          FINALPACKAGE: 1
          SIDELOADED: 1
          # theos-jailed defaults to zip -9 for final packages, which is slow on a ~200 MB IPA
          COMPRESSION: 6
          IPA: ${{ github.workspace }}/App.ipa
          APP_VERSION: ${{ steps.ipa_info.outputs.version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package_info.outputs.id }}_${{ steps.ipa_info.outputs.version }}-${{ steps.package_info.outputs.version }}
          path: packages/*.ipa
          if-no-files-found: error

      - name: Create release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: packages/*.ipa
          tag_name: v${{ steps.ipa_info.outputs.version }}-${{ steps.package_info.outputs.version }}
